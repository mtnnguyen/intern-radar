name: Update Internship Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

concurrency:
  group: intern-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update internship listings
        run: python tracker.py

      - name: Commit updated jobs
        run: |
          git config user.name "intern-radar-bot"
          git config user.email "intern-radar-bot@users.noreply.github.com"

          git add jobs.json jobs.md

          if ! git diff --cached --quiet; then
            git commit -m "Update internship listings"
            git push
          fi