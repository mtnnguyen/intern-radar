name: Intern Radar

on:
  schedule:
    - cron: "2/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intern-radar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update internship listings
        run: python tracker.py

      - name: Commit updated jobs
        run: |
          git config user.name "intern-radar-bot"
          git config user.email "intern-radar-bot@users.noreply.github.com"

          git add jobs.json jobs.md

          if ! git diff --cached --quiet; then
            git commit -m "Update internship listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi